  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1;
  transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
}

.console__keypad button:hover { background: var(--yellow); }
.console__keypad button:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 #000;
}

.console__keypad .is-enter {
  grid-column: auto;
  background: var(--red);
  color: #fff;
  font-size: 9px;
  letter-spacing: 0.1em;
}

.console__hint {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 6px;
  letter-spacing: 0.08em;
  color: #777d80;
  text-align: center;
  text-transform: uppercase;
}

.console__stripe {
  height: 11px;
  margin: 12px -18px 0;
  background: repeating-linear-gradient(45deg, var(--yellow) 0 9px, #11161c 9px 18px);
  border-top: 1px solid #000;
  border-bottom: 1px solid #000;
}

.console__tag {
  position: absolute;
  left: -26px;
  bottom: 34px;
  width: 76px;
  padding: 10px 6px 8px;
  background: var(--red);
  border: 2px solid #000;
  box-shadow: 3px 3px 0 #000;
  color: #fff;
  font-family: var(--mono);
  font-size: 6px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-align: center;
  text-transform: uppercase;
  transform: rotate(-8deg);
}

.console__tag::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -33px;
  width: 1px;
  height: 33px;
  background: #000;
  transform: rotate(10deg);
  transform-origin: bottom;
}

.console__tag::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 4px;
  width: 6px;
  height: 6px;
  margin-left: -3px;
  border: 1px solid rgba(0, 0, 0, 0.55);
  border-radius: 50%;
}

/* ══════════════════ HERO ══════════════════ */

.hero {
  background: var(--ink);
  color: var(--cream);
  border-bottom: 2px solid #000;
  padding-top: clamp(100px, 12vh, 140px);
  padding-bottom: clamp(70px, 9vh, 110px);
}

.hero__grid {
  background-image:
    radial-gradient(rgba(231, 226, 214, 0.14) 0.8px, transparent 0.8px),
    linear-gradient(to right, rgba(231, 226, 214, 0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(231, 226, 214, 0.05) 1px, transparent 1px);
  background-size: 13px 13px, 104px 104px, 104px 104px;
  -webkit-mask: radial-gradient(circle at 62% 48%, #000 0 28%, transparent 78%);
  mask: radial-gradient(circle at 62% 48%, #000 0 28%, transparent 78%);
  opacity: 0.9;
}

.hero__watermark {
  color: transparent;
  -webkit-text-stroke: 1px rgba(231, 226, 214, 0.075);
  font-family: var(--serif);
  font-size: 74vh;
  right: -1vw;
}

.hero__orbit { opacity: 0.8; }

.orbit-ring { border-color: rgba(226, 51, 38, 0.18); }
.orbit-ring--b { border-color: rgba(84, 180, 180, 0.16); }
.orbit-ring--c { border-color: rgba(231, 226, 214, 0.07); }

.hero__copy {
  border-left: 4px solid var(--red);
  padding-left: clamp(16px, 2vw, 26px);
}

.hero__copy > .eyebrow { margin-bottom: 16px; }

.hero__title-row {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  margin: 6px 0 22px;
}

.hero__title {
  font-family: var(--serif);
  font-size: clamp(4.6rem, 10.8vw, 11.4rem);
  font-weight: 900;
  line-height: 0.78;
  letter-spacing: -0.055em;
  margin: 0;
  color: var(--cream);
  display: flex;
}

.hero__title span:last-child { color: var(--red); }

.hero__typeplate {
  display: block;
  flex: none;
  margin-top: 4px;
  padding: 7px 8px 6px;
  border: 2px solid var(--cream);
  font-family: var(--mono);
  font-size: 8px;
  line-height: 1.3;
  letter-spacing: 0.08em;
  color: var(--cream);
  text-align: left;
  transform: rotate(3deg);
}

.hero__lede {
  max-width: 44ch;
  color: #b9b8ae;
  font-size: 14px;
  line-height: 1.62;
}

.hero__lede em { color: var(--red-bright); font-style: normal; font-family: inherit; font-size: inherit; }

.hero__actions { margin-top: 26px; gap: 20px; }
.hero .text-link { color: #b9b8ae; }

.hero__stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin-top: 32px;
  padding: 0;
  border: 1px solid #3b4145;
  background: #3b4145;
  max-width: 640px;
  box-shadow: 4px 4px 0 #000;
}

.hero__stats > div {
  background: #151a1f;
  padding: 10px 10px 9px;
}

.hero__stats dt {
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.1em;
  color: var(--steel);
  margin-bottom: 5px;
}

.hero__stats dd {
  font-family: var(--serif);
  font-size: clamp(18px, 1.9vw, 24px);
  font-weight: 900;
  line-height: 1;
  color: var(--cream);
  letter-spacing: -0.03em;
}

.hero__stats dd span { font-family: var(--mono); font-size: 7px; color: var(--steel); font-weight: 400; }
.hero__stats dd.gold { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; line-height: 1.3; color: var(--red-bright) !important; }

.hero__note {
  position: relative;
  width: 188px;
  margin-top: 26px;
  padding: 12px 12px 13px;
  background: var(--yellow);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 8px;
  line-height: 1.55;
  text-transform: uppercase;
  transform: rotate(-2.5deg);
  box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
  clip-path: polygon(0 0, 100% 0, 100% 88%, 92% 100%, 0 100%);
}

.hero__note::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  width: 62px;
  height: 15px;
  margin-left: -31px;
  background: rgba(231, 226, 214, 0.55);
  border: 1px solid rgba(17, 22, 28, 0.12);
  transform: rotate(-2deg);
}

.hero__note b {
  display: block;
  margin-bottom: 3px;
  padding-bottom: 3px;
  border-bottom: 1px solid rgba(17, 22, 28, 0.35);
  font-size: 7px;
  letter-spacing: 0.08em;
}

.hero__stage { min-height: 56vh; }

.hero__stage::before {
  width: 66%;
  height: 26%;
  top: 68%;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75), transparent 68%);
  filter: blur(14px);
}

.hero__target {
  position: absolute;
  width: min(54vw, 640px);
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.hero__target i {
  position: absolute;
  border: 1px solid rgba(226, 51, 38, 0.24);
  border-radius: 50%;
}

.hero__target i:nth-child(1) { inset: 0; border-style: dashed; }
.hero__target i:nth-child(2) { inset: 8%; border-color: rgba(84, 180, 180, 0.2); }
.hero__target i:nth-child(3) { inset: 18%; border-color: rgba(231, 226, 214, 0.12); }

.hero__watch {
  width: min(40vw, 520px);
  animation: none;
  transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  filter: drop-shadow(16px 22px 0 rgba(0, 0, 0, 0.22)) drop-shadow(0 26px 40px rgba(0, 0, 0, 0.5));
}

.hero__tag {
  color: var(--cream);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.08em;
  padding: 6px 8px;
  background: var(--ink);
  border: 1px solid #4a4f52;
  box-shadow: 3px 3px 0 #000;
  transform: rotate(-2deg);
}

.hero__tag b {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 900;
  color: var(--red-bright);
  letter-spacing: 0.02em;
}

.hero__tag::before { display: none; }
.hero__tag--a { left: -2%; top: 16%; }
.hero__tag--b { right: 1%; bottom: 17%; transform: rotate(2deg); text-align: right; }

.flight-tag {
  position: absolute;
  right: -3%;
  top: 26%;
  width: 74px;
  padding: 9px 5px 8px;
  background: var(--red);
  border: 2px solid #000;
  box-shadow: 3px 3px 0 #000;
  color: #fff;
  font-family: var(--mono);
  font-size: 6px;
  font-weight: 600;
  line-height: 1.45;
  text-align: center;
  text-transform: uppercase;
  transform: rotate(8deg);
  z-index: 4;
}

.flight-tag span {
  display: block;
  margin-bottom: 4px;
  padding-bottom: 3px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.35);
  font-size: 9px;
  letter-spacing: 0.1em;
}

.flight-tag::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -30px;
  width: 1px;
  height: 30px;
  background: #000;
  transform: rotate(-13deg);
  transform-origin: bottom;
}

.flight-tag::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 3px;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border: 1px solid rgba(0, 0, 0, 0.5);
  border-radius: 50%;
}

.hero__hint {
  bottom: 1%;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 9px;
  background: #0a0d10;
  border: 1px solid #3b4145;
  color: var(--steel);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.08em;
}

.hero__scroll {
  color: var(--steel);
  font-family: var(--mono);
  font-size: 8px;
}

.hero__scroll i { background: #3b4145; }
.hero__scroll i::after { background: var(--red); }

/* ══════════════════ TICKER ══════════════════ */

.ticker {
  background: var(--red);
  color: #fff;
  border-top: 2px solid #000;
  border-bottom: 2px solid #000;
  padding: 8px 0;
  box-shadow: inset 0 5px 0 #11161c, inset 0 -5px 0 #11161c;
}

.ticker__track span {
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: #fff;
}

.ticker__track b { color: var(--ink); margin: 0 10px; }

/* ══════════════════ ANATOMY ══════════════════ */

.anatomy {
  background:
    radial-gradient(circle at 84% 36%, rgba(84, 180, 180, 0.08), transparent 30%),
    var(--paper);
  color: var(--ink);
}

.anatomy__copy { border-left: 4px solid var(--ink); padding-left: clamp(14px, 2vw, 24px); }
.anatomy__copy .eyebrow { margin-bottom: 14px; }
.anatomy__copy .section-title { margin: 0 0 16px; }
.anatomy__copy .section-copy { color: #3b403e; }

.parts {
  margin-top: 24px;
  padding: 10px 14px 12px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  transform: rotate(-0.35deg);
}

.parts__head {
  padding: 3px 0 8px;
  border-bottom: 2px solid var(--ink);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--ink);
}

.parts__count b { color: var(--red); }

.parts__list li {
  grid-template-columns: 22px 18px minmax(0, 1fr) auto;
  gap: 8px;
  padding: 5px 4px;
  border-bottom: 1px dashed rgba(17, 22, 28, 0.22);
  color: #626763;
  font-size: 9px;
  transition: background 0.12s, color 0.12s, transform 0.12s;
}

.parts__list li::before {
  content: "";
  width: 10px;
  height: 10px;
  border: 1px solid var(--ink);
  background: transparent;
  grid-column: 2;
  grid-row: 1;
}

.parts__list li .parts__idx { grid-column: 1; }
.parts__list li .parts__name { grid-column: 3; }
.parts__list li .parts__spec { grid-column: 4; }

.parts__idx { font-family: var(--mono); font-size: 7px; color: #8a8d87; }
.parts__name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.02em; color: #333936; }
.parts__spec { font-family: var(--mono); font-size: 6px; letter-spacing: 0.04em; color: #84877f; }

.parts__list li.is-logged .parts__name { color: var(--ink); }
.parts__list li.is-logged::before {
  background: var(--red);
  border-color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--paper-2);
}

.parts__list li.is-active {
  background: var(--ink);
  color: var(--paper);
  transform: translateX(4px);
  padding-left: 8px;
}

.parts__list li.is-active .parts__name { color: var(--cream); }
.parts__list li.is-active .parts__idx { color: var(--yellow); }
.parts__list li.is-active .parts__spec { color: #9da1a0; }
.parts__list li.is-active::before { background: var(--yellow); border-color: var(--yellow); box-shadow: none; }

.movement__frame {
  width: min(100%, 66vh);
  border: 2px solid var(--ink);
  background:
    radial-gradient(rgba(231, 226, 214, 0.1) 0.7px, transparent 0.7px),
    radial-gradient(circle at 50% 50%, rgba(84, 180, 180, 0.08), transparent 62%),
    #0d1216;
  background-size: 14px 14px, auto, auto;
  box-shadow: 8px 8px 0 rgba(17, 22, 28, 0.28);
}

.movement__frame::before {
  inset: 7px;
  border: 1px dashed rgba(231, 226, 214, 0.16);
}

.movement__corner {
  display: block;
  width: 9px;
  height: 9px;
  border: 1px solid #000 !important;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d7d7d2, #5d6265 48%, #15181b 75%);
  opacity: 0.95;
  top: auto;
  right: auto;
  bottom: auto;
  left: auto;
}

.movement__corner--tl { top: 8px; left: 8px; }
.movement__corner--tr { top: 8px; right: 8px; }
.movement__corner--bl { bottom: 8px; left: 8px; }
.movement__corner--br { bottom: 8px; right: 8px; }

.movement__fig {
  position: absolute;
  left: 18px;
  top: 14px;
  z-index: 3;
  display: flex;
  align-items: baseline;
  gap: 7px;
  color: var(--cream);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.movement__fig b {
  padding: 3px 5px;
  background: var(--red);
  color: #fff;
  font-size: 7px;
}

.movement__fig span { color: var(--steel); }

.movement__scale {
  inset: 14px;
  color: var(--steel);
  font-size: 6px;
  letter-spacing: 0.08em;
}

.movement__readout {
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: 14px;
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
}

.movement__readout-idx {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 900;
  color: var(--red);
  border-right: 2px solid var(--ink);
  padding-right: 14px;
}

.movement__readout-body b {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.movement__readout-body span {
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.03em;
  color: #646a66;
}

.movement__readout-tick i { background: var(--red); width: 3px; }

.movement__progress {
  height: 8px;
  margin-top: 10px;
  background: #c2bcaf;
  border: 1px solid var(--ink);
}

.movement__progress i {
  background: repeating-linear-gradient(90deg, var(--red) 0 12px, var(--yellow) 12px 15px);
}

/* ══════════════════ COMPLICATIONS ══════════════════ */

.complications {
  background: #d6d1c4;
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
}

.comp-grid { gap: 22px; }

.comp-card {
  --tab: var(--red);
  position: relative;
  min-height: 478px;
  padding: 0;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  box-shadow: 7px 7px 0 var(--ink);
  transform: rotate(-0.55deg);
  overflow: visible;
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}

.comp-card:nth-child(2) { --tab: var(--teal); transform: rotate(0.35deg); }
.comp-card:nth-child(3) { --tab: var(--blue); transform: rotate(0.5deg); }
.comp-card:nth-child(4) { --tab: var(--yellow); transform: rotate(-0.35deg); }

.comp-card::before {
  content: "";
  position: absolute;
  inset: auto;
  top: -2px;
  left: 18px;
  width: 98px;
  height: 24px;
  background: var(--tab);
  border: 2px solid var(--ink);
  border-bottom: 0;
  opacity: 1;
  z-index: 3;
  pointer-events: none;
}

.comp-card::after { display: none; }

.comp-card:hover,
.comp-card:focus-visible {
  transform: translate(-2px, -5px) rotate(0deg);
  box-shadow: 11px 11px 0 var(--ink);
  border-color: var(--ink);
  background: var(--paper-2);
}

.comp-card__top {
  padding: 13px 18px 9px;
  border-bottom: 1px dashed rgba(17, 22, 28, 0.22);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  color: #6c716d;
  z-index: 2;
}

.comp-card__no { color: var(--red); font-weight: 600; }
.comp-card__status { color: var(--ink); }

.comp-card__visual {
  position: relative;
  height: 222px;
  margin: 12px 16px 2px;
  background:
    radial-gradient(rgba(231, 226, 214, 0.12) 0.7px, transparent 0.7px),
    #10161b;
  background-size: 12px 12px;
  border: 2px solid var(--ink);
  overflow: hidden;
}

.comp-card__visual::before {
  content: "";
  position: absolute;
  inset: 0;
  width: auto;
  height: auto;
  border-radius: 0;
  filter: none;
  background-image:
    linear-gradient(to right, rgba(231, 226, 214, 0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(231, 226, 214, 0.06) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.comp-card__visual::after {
  content: "CAL. T-01 / MODULE DIAGRAM";
  position: absolute;
  left: 8px;
  right: auto;
  bottom: 6px;
  top: auto;
  width: auto;
  height: auto;
  border: 0;
  border-radius: 0;
  font-family: var(--mono);
  font-size: 5px;
  letter-spacing: 0.1em;
  color: #69706f;
}

.comp-card__visual svg {
  width: 196px;
  height: 196px;
  filter: none;
}

.comp-card:hover .comp-card__visual svg { transform: scale(1.03); }

.cx-ring { stroke: rgba(231, 226, 214, 0.42); stroke-width: 1.1; }
.cx-ring--dim { stroke: rgba(231, 226, 214, 0.15); }
.cx-ring--gold { stroke: var(--red); stroke-width: 1.8; }
.cx-ring--dash { stroke-dasharray: 2 7; stroke: rgba(226, 51, 38, 0.5); }
.cx-ring--teeth { stroke: rgba(226, 51, 38, 0.45); stroke-width: 5; stroke-dasharray: 1 7; }
.cx-line { stroke: rgba(231, 226, 214, 0.48); }
.cx-line--dim { stroke: rgba(231, 226, 214, 0.16); }
.cx-fill-gold { fill: var(--red); }
.cx-fill-cream { fill: var(--cream); }

.cx-aperture { fill: var(--cream); }
.cx-aperture--small { fill: var(--paper-2); stroke: rgba(226, 51, 38, 0.55); }
.cx-aperture-frame { fill: none; stroke: var(--red); stroke-width: 1.2; }
.cx-mini { fill: var(--ink); font-size: 5.5px; }
.cx-digit { fill: var(--ink); }
.cx-digit--big { font-size: 40px; fill: var(--ink); }
.cx-micro { fill: #9fa4a1; font-size: 7px; }
.cx-disc { animation: spin 45s linear infinite reverse; transform-origin: 110px 110px; }

.cx-gong { stroke: var(--red); stroke-width: 1.6; }
.cx-gong--2 { stroke: var(--teal); stroke-width: 1.2; }
.cx-hammer-head { fill: var(--red); }

.comp-card__body { padding: 16px 18px 18px; z-index: 2; }

.comp-card__body h3 {
  font-family: var(--serif);
  font-size: clamp(1.55rem, 2.2vw, 2.15rem);
  font-weight: 900;
  line-height: 0.9;
  letter-spacing: -0.035em;
  text-transform: uppercase;
}

.comp-card__sub {
  margin: 5px 0 10px;
  font-family: var(--mono);
  font-style: normal;
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--red);
}

.comp-card__desc {
  max-width: 48ch;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.55;
  color: #3e4441;
}

.comp-card__foot {
  margin-top: 16px;
  padding-top: 10px;
  border-top: 2px solid var(--ink);
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 0.08em;
  color: #6b706c;
}

.comp-card__action { color: var(--ink); font-weight: 500; }
.comp-card__action b { color: var(--red); margin-left: 4px; font-weight: 600; }

.comp-card__stamp {
  top: 41%;
  right: 6%;
  padding: 8px 12px 6px;
